<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F3F5FA">
<title>Portafolio · Análisis de Datos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{
  --fondo:#F3F5FA; --papel:#FFFFFF; --tinta:#1F2340; --suave:#5B5F7E; --tenue:#9A9DB5; --linea:#E1E4EF;
  --accion:#3B3F8F; --accion-hover:#2C2F72; --ok:#2E8B57; --sube:#D98A1E; --hace:#A9ACC2; --mal:#C2414E;
  --radio:18px; --sombra:0 1px 2px rgba(31,35,64,.06),0 8px 24px rgba(31,35,64,.06);
  --display:'Bricolage Grotesque',system-ui,sans-serif; --cuerpo:'Figtree',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fondo);color:var(--tinta);font-family:var(--cuerpo);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accion);outline-offset:3px;border-radius:10px}
.oculto{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h1,h2,h3,h4{font-family:var(--display);margin:0;letter-spacing:-.02em}
p{margin:0}

/* Entrada */
#entrada{min-height:100dvh;display:grid;place-items:center;padding:24px 16px;position:relative;overflow:hidden}
.puntos{position:absolute;inset:0;pointer-events:none}
.puntos span{position:absolute;width:var(--t);height:var(--t);border-radius:28%;background:var(--c);opacity:.9;animation:flota 9s ease-in-out infinite alternate;animation-delay:var(--d)}
@keyframes flota{to{transform:translate(var(--x),var(--y)) rotate(18deg)}}
.tarjeta-entrada{position:relative;background:var(--papel);border-radius:28px;box-shadow:var(--sombra);padding:32px 26px;width:min(400px,100%)}
.tarjeta-entrada h1{font-size:34px;line-height:1.05;font-weight:800}
.tarjeta-entrada p{color:var(--suave);margin:10px 0 22px}
label.campo{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.caja-clave{display:flex;gap:8px}
input[type=password],input[type=text],input[type=search],input[inputmode]{flex:1;min-width:0;height:52px;border:2px solid var(--linea);border-radius:14px;padding:0 14px;font:inherit;font-size:17px;background:var(--fondo);color:var(--tinta)}
input:focus{outline:none;border-color:var(--accion)}
.ojo{width:52px;border:2px solid var(--linea);background:var(--papel);border-radius:14px;font-size:20px}
.recordar{display:flex;align-items:center;gap:8px;margin:14px 0 20px;font-size:14px;color:var(--suave)}
.recordar input{width:20px;height:20px;accent-color:var(--accion)}
.boton{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:14px;border:0;background:var(--accion);color:#fff;font-weight:600;font-size:16px;transition:background .15s,transform .1s,filter .15s;text-decoration:none}
.boton:hover{background:var(--accion-hover)}
.boton:active{transform:scale(.97)}
.boton.ancho{width:100%}
.boton.claro{background:var(--fondo);color:var(--tinta)}
.boton.claro:hover{background:var(--linea)}
.boton.c{background:var(--c)}
.boton.c:hover{filter:brightness(.92)}
.boton.peq{height:40px;font-size:14px;padding:0 14px;border-radius:12px}
.error{color:var(--mal);font-size:14px;margin-top:10px;min-height:20px}

/* Marco */
#app{max-width:820px;margin:0 auto;padding:18px 16px 120px}
.vista{animation:entra .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes entra{from{opacity:0;transform:translateY(10px)}}
.eyebrow{font-size:13px;font-weight:600;color:var(--suave);letter-spacing:.02em}
.titulo-vista{font-size:clamp(32px,8.5vw,48px);font-weight:800;line-height:1.02;margin:6px 0 8px}
.bajada{font-size:17px;color:var(--suave)}
.bajada b{color:var(--tinta);font-weight:600}
.panel{background:var(--papel);border-radius:var(--radio);box-shadow:var(--sombra);padding:20px;margin-top:16px}
.panel>h2{font-size:21px;font-weight:600}
.sub{color:var(--suave);font-size:14px;margin-top:4px}
.seccion-t{font-size:22px;font-weight:600;margin:28px 4px 10px}

/* Inicio: avance */
.barra-total{display:flex;height:22px;border-radius:11px;overflow:hidden;background:var(--fondo);margin:16px 0 14px}
.barra-total i{display:block;height:100%;width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.estados3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.est{border:0;border-radius:16px;padding:14px 12px;text-align:left;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;gap:2px;transition:transform .15s}
.est:hover{transform:translateY(-2px)}
.est i{font-size:22px}
.est b{font-family:var(--display);font-size:32px;font-weight:800;line-height:1}
.est span{font-size:13px;font-weight:600}
.dominio{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.dom{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;border:0;background:transparent;padding:0;text-align:left}
.dom .ic{width:40px;height:40px;border-radius:12px;background:var(--cs);color:var(--c);display:grid;place-items:center;font-size:20px}
.dom b{font-size:15px;font-weight:600;display:block;line-height:1.2}
.dom .pista{height:8px;background:var(--fondo);border-radius:4px;margin-top:6px;overflow:hidden}
.dom .pista i{display:block;height:100%;width:0;background:var(--c);border-radius:4px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.dom .pct{font-family:var(--display);font-weight:800;font-size:18px;color:var(--c);min-width:48px;text-align:right}
.sigue{display:flex;gap:14px;align-items:center;border-radius:var(--radio);padding:18px;margin-top:16px;border:0;width:100%;text-align:left;background:var(--c);color:#fff}
.sigue .ic{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:24px;flex:none}
.sigue b{display:block;font-family:var(--display);font-size:19px;font-weight:600}
.sigue span{font-size:14px;opacity:.92}
.sigue .ti-chevron-right{margin-left:auto;font-size:24px}

/* Documentos */
.estante{margin-top:18px}
.estante-cab{display:flex;align-items:center;gap:10px;margin:0 4px 10px}
.estante-cab .pt{width:12px;height:12px;border-radius:4px;background:var(--c)}
.estante-cab h3{font-size:17px;font-weight:600}
.estante-cab span{font-size:13px;color:var(--suave);margin-left:auto}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.doc{border:0;background:var(--papel);border-radius:16px;box-shadow:var(--sombra);padding:0;text-align:left;overflow:hidden;display:flex;flex-direction:column;transition:transform .18s}
.doc:hover{transform:translateY(-3px) rotate(-.4deg)}
.doc .portada{aspect-ratio:3/3.4;background:var(--cs);position:relative;overflow:hidden;display:grid;place-items:center}
.doc .portada img{width:86%;margin-top:14%;border-radius:4px 4px 0 0;box-shadow:0 2px 10px rgba(31,35,64,.18);background:#fff;align-self:start}
.doc .portada .tipo-g{font-size:46px;color:var(--c)}
.doc .portada .sello{position:absolute;top:8px;left:8px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px}
.doc .info{padding:10px 12px 12px}
.doc .info b{display:block;font-size:14px;font-weight:600;line-height:1.25}
.doc .info span{font-size:12px;color:var(--suave)}
.buscador{display:flex;gap:8px;margin-top:16px}
.buscador input{height:48px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{border:2px solid var(--linea);background:var(--papel);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;color:var(--suave)}
.chip[aria-pressed=true]{background:var(--tinta);border-color:var(--tinta);color:#fff}

/* Estados */
.estado{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:4px}
.estado.entregado{background:#E3F3EA;color:#1F6B42}
.estado.sube{background:#FFF0D9;color:#8A5410}
.estado.hace{background:#ECEDF4;color:#5B5F7E}
.etq{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--fondo);color:var(--suave)}

/* Estudiar */
.temas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:16px}
.tema-c{border:0;background:var(--papel);border-radius:var(--radio);box-shadow:var(--sombra);padding:18px;text-align:left;position:relative;overflow:hidden;transition:transform .18s}
.tema-c:hover{transform:translateY(-3px)}
.tema-c::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:32px;background:var(--cs);transform:rotate(18deg)}
.tema-c .ic{width:48px;height:48px;border-radius:14px;background:var(--c);color:#fff;display:grid;place-items:center;font-size:24px;position:relative;z-index:1}
.tema-c .cod{font-family:var(--mono);font-size:12px;color:var(--suave);margin-top:12px;display:block}
.tema-c h3{font-size:19px;font-weight:600;line-height:1.2;margin-top:2px}
.tema-c .anillo{position:absolute;right:16px;bottom:16px;z-index:1}
.tema-c .meta{font-size:13px;color:var(--suave);margin-top:6px;padding-right:60px}

.cab-tema{border-radius:24px;padding:22px 20px;color:#fff;background:var(--c);position:relative;overflow:hidden;margin-top:6px}
.cab-tema::after{content:"";position:absolute;right:-40px;bottom:-60px;width:180px;height:180px;border-radius:50px;background:rgba(255,255,255,.14);transform:rotate(24deg)}
.cab-tema .volver{border:0;background:rgba(255,255,255,.22);color:#fff;border-radius:12px;height:38px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px}
.cab-tema h1{font-size:clamp(28px,7vw,40px);font-weight:800;line-height:1.05;margin-top:14px;position:relative;z-index:1}
.cab-tema p{opacity:.92;margin-top:8px;position:relative;z-index:1;max-width:560px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px;margin:16px -4px 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;background:var(--papel);border-radius:14px;padding:10px 14px;font-weight:600;font-size:15px;color:var(--suave);display:flex;align-items:center;gap:6px;box-shadow:var(--sombra)}
.tabs button[aria-selected=true]{background:var(--c);color:#fff}

/* Lección */
.leccion{background:var(--papel);border-radius:var(--radio);box-shadow:var(--sombra);padding:22px 20px;margin-top:14px;animation:entra .35s both}
.pasos-l{display:flex;gap:6px;margin-bottom:16px}
.pasos-l i{flex:1;height:6px;border-radius:3px;background:var(--fondo)}
.pasos-l i.on{background:var(--c)}
.leccion h2{font-size:26px;font-weight:800;line-height:1.1;margin-bottom:14px}
.leccion .exp p{margin-bottom:12px;font-size:16.5px}
.caja{border-radius:14px;padding:14px 16px;margin-top:12px;font-size:15px}
.caja .et{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:6px;margin-bottom:6px}
.caja.formula{background:var(--cs);font-family:var(--mono);font-size:15px;color:var(--tinta)}
.caja.formula .et{font-family:var(--cuerpo);color:var(--c)}
.caja.ejemplo{background:#EEF7F1}
.caja.ejemplo .et{color:#1F6B42}
.caja.error-c{background:#FCEDEF}
.caja.error-c .et{color:#9A2B37}
pre.py{background:#1F2340;color:#E6E8F5;border-radius:14px;padding:14px 16px;font-family:var(--mono);font-size:13.5px;line-height:1.6;overflow-x:auto;margin:12px 0 0;white-space:pre}
pre.py .et{color:#9FA3D6;font-family:var(--cuerpo);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;display:block;margin-bottom:6px}
.nav-l{display:flex;gap:10px;margin-top:18px}
.nav-l .boton{flex:1}

/* Práctica */
.ej{background:var(--papel);border-radius:var(--radio);box-shadow:var(--sombra);padding:18px;margin-top:14px}
.ej .n{font-size:12px;font-weight:600;color:var(--c);letter-spacing:.04em;text-transform:uppercase}
.ej p.q{font-size:17px;font-weight:500;margin:6px 0 12px}
.datos{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.datos span{font-family:var(--mono);font-size:14px;background:var(--cs);border-radius:8px;padding:4px 9px}
.ops{display:flex;flex-direction:column;gap:8px}
.op{border:2px solid var(--linea);background:var(--papel);border-radius:14px;padding:12px 14px;text-align:left;font-size:15.5px;display:flex;gap:10px;align-items:center;transition:border-color .15s,background .15s}
.op:hover{border-color:var(--c)}
.op .l{width:26px;height:26px;border-radius:8px;background:var(--fondo);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.op.bien{border-color:var(--ok);background:#EEF7F1}
.op.mal{border-color:var(--mal);background:#FCEDEF}
.op:disabled{cursor:default}
.resp{display:flex;gap:8px;align-items:center}
.resp input{height:48px;max-width:200px}
.resp .u{color:var(--suave);font-size:15px}
.feedback{margin-top:12px;border-radius:14px;padding:12px 14px;font-size:15px;animation:entra .3s both}
.feedback.bien{background:#EEF7F1;color:#1F4D33}
.feedback.mal{background:#FCEDEF;color:#6E1E28}
.feedback b{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.feedback ol{margin:6px 0 0;padding-left:20px}
.marcador{display:flex;align-items:center;gap:12px;background:var(--papel);border-radius:16px;box-shadow:var(--sombra);padding:12px 16px;margin-top:14px;position:sticky;top:8px;z-index:3}
.marcador b{font-family:var(--display);font-size:22px;font-weight:800;color:var(--c)}
.marcador .pista{flex:1;height:8px;background:var(--fondo);border-radius:4px;overflow:hidden}
.marcador .pista i{display:block;height:100%;background:var(--c);transition:width .4s}

/* Juegos */
.juego{background:var(--papel);border-radius:var(--radio);box-shadow:var(--sombra);padding:18px;margin-top:14px}
.juego h3{font-size:19px;font-weight:600;display:flex;gap:8px;align-items:center}
.juego h3 i{color:var(--c)}
.tablero{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:14px}
.ficha-j{border:0;height:84px;border-radius:14px;background:var(--c);color:#fff;font-weight:600;font-size:14px;padding:8px;transition:transform .25s,background .2s;position:relative}
.ficha-j .tx{opacity:0;transition:opacity .2s}
.ficha-j::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:30px;font-weight:800;transition:opacity .2s}
.ficha-j.vista{background:var(--cs);color:var(--tinta);transform:rotateY(0)}
.ficha-j.vista .tx{opacity:1}
.ficha-j.vista::after{opacity:0}
.ficha-j.par{background:#E3F3EA;color:#1F6B42;animation:pop .4s both}
.ficha-j.par .tx{opacity:1}.ficha-j.par::after{opacity:0}
@keyframes pop{50%{transform:scale(1.07)}}
.item-c{border:2px solid var(--linea);background:var(--papel);border-radius:14px;padding:10px 14px;font-size:15px;font-weight:600}
.item-c[aria-pressed=true]{border-color:var(--c);background:var(--cs)}
.cubetas{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:12px}
.cubeta{border:2px dashed var(--c);border-radius:14px;background:transparent;min-height:90px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:6px}
.cubeta b{font-size:14px;color:var(--c)}
.cubeta .puesto{font-size:13px;background:#E3F3EA;color:#1F6B42;border-radius:8px;padding:3px 8px;animation:pop .35s both}
.sueltos{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.sacudir{animation:sacude .35s}
@keyframes sacude{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.orden-l{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.paso-o{border:2px solid var(--linea);background:var(--papel);border-radius:14px;padding:12px 14px;text-align:left;font-size:15px;font-weight:600;display:flex;gap:10px;align-items:center}
.paso-o .nn{width:28px;height:28px;border-radius:9px;background:var(--fondo);display:grid;place-items:center;font-size:13px;flex:none}
.paso-o.hecho{border-color:var(--ok);background:#EEF7F1}
.paso-o.hecho .nn{background:var(--ok);color:#fff}
.gana{display:flex;gap:12px;align-items:center;background:#FFF7DB;border-radius:16px;padding:14px;margin-top:14px;animation:entra .3s both}
.gana i{font-size:30px;color:#C08A00}

/* Video */
.video{background:#000;border-radius:var(--radio);overflow:hidden;margin-top:14px;aspect-ratio:16/9}
.video video{width:100%;height:100%;display:block}
.capitulos{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.capitulos button{border:0;background:var(--papel);border-radius:12px;padding:10px 14px;text-align:left;display:flex;gap:10px;align-items:center;font-size:15px;box-shadow:var(--sombra)}
.capitulos button span{font-family:var(--mono);font-size:13px;color:var(--c)}

/* Trabajos (actividad) */
.act{background:var(--papel);border-radius:var(--radio);box-shadow:var(--sombra);padding:16px;margin-top:12px}
.act .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.act h3{font-size:18px;font-weight:600;margin:10px 0 2px;line-height:1.25}
.act .fecha{font-size:13px;color:var(--tenue)}
.acciones{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}

/* Examen */
.ex-conf{display:flex;flex-direction:column;gap:14px}
.ex-q{background:var(--papel);border-radius:var(--radio);box-shadow:var(--sombra);padding:20px;margin-top:14px;animation:entra .3s both}
.ex-q .cab{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ex-q .cab .tm{margin-left:auto;font-family:var(--mono);font-size:14px;color:var(--suave)}
.ex-q p.q{font-size:19px;font-weight:600;margin-bottom:14px;line-height:1.35}
.resultado{text-align:center;padding:26px 20px}
.resultado .grande{font-family:var(--display);font-size:64px;font-weight:800;line-height:1}
.repaso-err{text-align:left;margin-top:12px}
.repaso-err .e{border-top:1px solid var(--linea);padding:12px 0}
.repaso-err .e:first-child{border-top:0}

/* Hoja */
.velo{position:fixed;inset:0;background:rgba(31,35,64,.35);z-index:30;opacity:0;transition:opacity .25s}
.velo.on{opacity:1}
.hoja{position:fixed;left:0;right:0;bottom:0;max-height:92dvh;min-height:72dvh;overflow:auto;background:var(--fondo);border-radius:28px 28px 0 0;z-index:31;transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
.hoja.on{transform:none}
@media(min-width:860px){.hoja{left:50%;right:auto;width:820px;margin-left:-410px}}
.cabh{position:sticky;top:0;z-index:2;padding:12px 18px 16px;background:var(--c);color:#fff}
.cabh .asa{width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.55);margin:0 auto 12px}
.cabh .fila{display:flex;align-items:flex-start;gap:12px}
.cabh h2{font-size:22px;font-weight:800;line-height:1.15}
.cabh .meta{font-size:14px;opacity:.9;margin-top:4px}
.cerrar{margin-left:auto;border:0;background:rgba(255,255,255,.22);color:#fff;width:40px;height:40px;border-radius:12px;font-size:22px;flex:none;display:grid;place-items:center}
.contenido{padding:16px 16px 40px}
.bloque{background:var(--papel);border-radius:var(--radio);padding:18px;margin-bottom:14px;box-shadow:var(--sombra)}
.bloque h4{font-size:17px;font-weight:600;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.bloque h4 i{color:var(--c);font-size:20px}
.archivo{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--linea)}
.archivo:first-of-type{border-top:0}
.archivo .tipo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex:none;background:var(--cs);color:var(--c)}
.archivo .nom{flex:1;min-width:0}
.archivo .nom b{display:block;font-size:15px;font-weight:600}
.archivo .nom span{font-size:13px;color:var(--suave);word-break:break-word}
.mini{border:0;background:var(--fondo);border-radius:12px;width:44px;height:44px;font-size:20px;display:grid;place-items:center;flex:none}
.mini:hover{background:var(--linea)}
.cartas{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.carta{perspective:800px;height:150px;border:0;background:transparent;padding:0;display:block;width:100%}
.carta .in{display:block;position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.carta.vuelta .in{transform:rotateY(180deg)}
.carta .cara{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:12px;display:flex;align-items:center;justify-content:center;text-align:center}
.carta .frente{background:var(--cs);font-family:var(--display);font-weight:600;font-size:17px;flex-direction:column;gap:6px}
.carta .frente small{font-family:var(--cuerpo);font-size:11px;font-weight:600;color:var(--c)}
.carta .reves{background:var(--c);color:#fff;transform:rotateY(180deg);font-size:13.5px;line-height:1.35;overflow:auto}
ul.limpia{list-style:none;margin:0;padding:0}
.codigo li{display:flex;flex-direction:column;padding:8px 0;border-top:1px solid var(--linea)}
.codigo li:first-child{border-top:0}
.codigo code{font-family:var(--mono);font-size:13.5px;color:var(--c);word-break:break-word}
.codigo span{font-size:14px;color:var(--suave)}
.hallazgos li{display:flex;gap:10px;padding:6px 0}
.hallazgos li i{color:var(--c);font-size:20px;flex:none;margin-top:1px}
.pagina{display:block;width:100%;height:auto;background:#fff;border-radius:8px;box-shadow:var(--sombra);margin-bottom:12px}
.gira{display:inline-block;animation:gira 1s linear infinite}@keyframes gira{to{transform:rotate(360deg)}}

/* Barra inferior */
nav.abajo{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));background:var(--tinta);border-radius:22px;padding:6px;display:flex;gap:2px;box-shadow:0 10px 30px rgba(31,35,64,.25);z-index:20;width:max-content;max-width:calc(100vw - 20px)}
nav.abajo button{border:0;background:transparent;color:#C9CBE0;border-radius:16px;padding:7px 12px;display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:600;gap:1px;white-space:nowrap}
nav.abajo button i{font-size:22px}
nav.abajo button[aria-current=page]{background:#fff;color:var(--tinta)}

.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:var(--tinta);color:#fff;padding:12px 18px;border-radius:14px;font-size:15px;opacity:0;transition:all .3s;z-index:50;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.confeti{position:fixed;pointer-events:none;z-index:60;width:10px;height:10px;border-radius:3px}
.vacio{text-align:center;color:var(--suave);padding:30px 10px}
.pie{text-align:center;color:var(--tenue);font-size:12px;margin-top:30px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<section id="entrada">
  <div class="puntos" aria-hidden="true">
    <span style="--t:90px;--c:#E07A5F;left:6%;top:10%;--x:20px;--y:30px;--d:0s"></span>
    <span style="--t:60px;--c:#2A9D8F;right:10%;top:14%;--x:-30px;--y:20px;--d:-2s"></span>
    <span style="--t:110px;--c:#8E7DBE;left:-20px;bottom:12%;--x:30px;--y:-20px;--d:-4s"></span>
    <span style="--t:70px;--c:#E9A23B;right:-10px;bottom:20%;--x:-20px;--y:-30px;--d:-1s"></span>
    <span style="--t:46px;--c:#D1607A;left:40%;top:4%;--x:10px;--y:24px;--d:-3s"></span>
    <span style="--t:54px;--c:#3D7DCA;left:22%;bottom:4%;--x:24px;--y:-14px;--d:-5s"></span>
    <span style="--t:38px;--c:#5E9E4F;right:28%;bottom:6%;--x:-16px;--y:-20px;--d:-6s"></span>
  </div>
  <form class="tarjeta-entrada" id="formEntrada" autocomplete="on">
    <h1>Tu portafolio de Análisis de Datos</h1>
    <p>Tus trabajos, tu avance y todo para estudiar cada tema antes del examen.</p>
    <input type="text" name="username" value="portafolio" autocomplete="username" class="sr" tabindex="-1" aria-hidden="true">
    <label class="campo" for="clave">Contraseña</label>
    <div class="caja-clave">
      <input id="clave" type="password" autocomplete="current-password" required>
      <button type="button" class="ojo" id="ojo" aria-label="Mostrar contraseña"><i class="ti ti-eye"></i></button>
    </div>
    <label class="recordar"><input type="checkbox" id="recordar" checked> Recordarla en este dispositivo</label>
    <button class="boton ancho" type="submit" id="btnEntrar" style="height:52px"><span>Entrar</span><i class="ti ti-arrow-right"></i></button>
    <div class="error" id="error" role="alert"></div>
  </form>
</section>

<main id="app" class="oculto"></main>

<nav class="abajo oculto" id="nav" aria-label="Secciones">
  <button data-ir="inicio" aria-current="page"><i class="ti ti-home"></i>Inicio</button>
  <button data-ir="documentos"><i class="ti ti-folders"></i>Documentos</button>
  <button data-ir="estudiar"><i class="ti ti-school"></i>Estudiar</button>
  <button data-ir="examen"><i class="ti ti-checklist"></i>Examen</button>
</nav>

<div class="velo oculto" id="velo"></div>
<div class="hoja" id="hoja" role="dialog" aria-modal="true" aria-labelledby="hojaTitulo"></div>
<div class="toast" id="toast" role="status"></div>

<script>
const SAL = "A807s3xsZKVRAqBmQeFJyg==", ITER = 250000, ACTUALIZADO = "2026-10-18T1823";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const aB64 = u => btoa(String.fromCharCode(...new Uint8Array(u)));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const leer = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const reducido = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
let LLAVE = null, D = null;

/* ---------- Cifrado ---------- */
async function derivar(clave) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(clave), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(SAL), iterations: ITER, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, true, ['decrypt']);
}
async function descifrar(buf) { const u = new Uint8Array(buf); return crypto.subtle.decrypt({name: 'AES-GCM', iv: u.slice(0, 12)}, LLAVE, u.slice(12)); }
async function cargarDatos() {
  const r = await fetch('datos.bin?v=' + ACTUALIZADO, {cache: 'no-store'});
  if (!r.ok) throw new Error('red');
  return JSON.parse(new TextDecoder().decode(await descifrar(await r.arrayBuffer())));
}

/* ---------- Entrada ---------- */
$('#ojo').onclick = () => { const i = $('#clave'), v = i.type === 'password'; i.type = v ? 'text' : 'password';
  $('#ojo').innerHTML = `<i class="ti ti-eye${v ? '-off' : ''}"></i>`; $('#ojo').setAttribute('aria-label', v ? 'Ocultar contraseña' : 'Mostrar contraseña'); };
$('#clave').oninput = () => { $('#error').textContent = ''; };
$('#formEntrada').onsubmit = async e => {
  e.preventDefault();
  const clave = $('#clave').value;
  if (!clave) { $('#error').textContent = 'Escribe la contraseña para entrar.'; return; }
  $('#btnEntrar').firstElementChild.textContent = 'Abriendo…';
  try {
    LLAVE = await derivar(clave); D = await cargarDatos();
    if ($('#recordar').checked) guardar('llave', aB64(await crypto.subtle.exportKey('raw', LLAVE)) + '|' + SAL);
    iniciar();
  } catch (err) {
    LLAVE = null;
    $('#error').textContent = err.message === 'red' ? 'No se pudo conectar. Revisa el internet e inténtalo de nuevo.' : 'Esa contraseña no es la correcta. Revísala e inténtalo otra vez.';
    $('#btnEntrar').firstElementChild.textContent = 'Entrar';
  }
};
(async () => {
  const g = leer('llave'); if (!g) return;
  const [k, s] = g.split('|'); if (s !== SAL) return;
  try { LLAVE = await crypto.subtle.importKey('raw', b64(k), 'AES-GCM', true, ['decrypt']); D = await cargarDatos(); iniciar(); } catch (e) { LLAVE = null; }
})();

/* ---------- Utilidades ---------- */
const TIPO_ARCH = {pdf: {ic: 'ti-file-type-pdf', nombre: 'PDF para leer'}, ipynb: {ic: 'ti-notebook', nombre: 'Notebook (archivo original)'},
  docx: {ic: 'ti-file-type-doc', nombre: 'Word (archivo original)'}, csv: {ic: 'ti-table', nombre: 'Datos en CSV'}};
const estadoClase = e => e === 'entregado' ? 'entregado' : e === 'por subir' ? 'sube' : 'hace';
const estadoTexto = e => e === 'entregado' ? 'Entregado' : e === 'por subir' ? 'Por subir' : 'Por hacer';
const estadoIcono = e => e === 'entregado' ? 'ti-check' : e === 'por subir' ? 'ti-cloud-upload' : 'ti-pencil';
const tema = id => D.temas.find(t => t.id === id);
const actsDe = id => D.actividades.filter(a => a.tema === id);
const fecha = f => f ? new Date(f + 'T12:00').toLocaleDateString('es', {day: 'numeric', month: 'long'}) : '';
const kb = n => n > 1e6 ? (n / 1e6).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1e3)) + ' KB';
function suave(hex, a = .14) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
function fuerte(hex) {
  let c = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
  const lum = c => { const f = v => (v /= 255) <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; return .2126 * f(c[0]) + .7152 * f(c[1]) + .0722 * f(c[2]); };
  while (1.05 / (lum(c) + .05) < 4.6) c = c.map(v => Math.floor(v * .94));
  return '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
}
const varsTema = t => `--c:${fuerte(t.color)};--cs:${suave(t.color)}`;
const fmt = x => (Math.round(x * 10000) / 10000).toLocaleString('es');
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 2600); }
function confeti(x, y) {
  if (reducido()) return;
  const cols = D.temas.map(t => t.color);
  for (let i = 0; i < 28; i++) {
    const p = document.createElement('i'); p.className = 'confeti'; p.style.background = cols[i % cols.length]; p.style.left = x + 'px'; p.style.top = y + 'px';
    document.body.appendChild(p);
    const a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 120;
    p.animate([{transform: 'translate(0,0)', opacity: 1}, {transform: `translate(${Math.cos(a) * d}px,${Math.sin(a) * d + 70}px) rotate(${Math.random() * 540}deg)`, opacity: 0}],
      {duration: 900 + Math.random() * 500, easing: 'cubic-bezier(.2,.8,.3,1)'}).onfinish = () => p.remove();
  }
}
function contar(el, n) {
  if (reducido()) { el.textContent = n; return; }
  const t0 = performance.now();
  const paso = t => { const k = Math.min(1, (t - t0) / 900); el.textContent = Math.round(n * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(paso); };
  requestAnimationFrame(paso);
}
function anillo(pct, color, tam = 46) {
  const r = tam / 2 - 5, c = 2 * Math.PI * r;
  return `<svg width="${tam}" height="${tam}" viewBox="0 0 ${tam} ${tam}" class="anillo" aria-label="${pct}% dominado"><circle cx="${tam / 2}" cy="${tam / 2}" r="${r}" fill="none" stroke="#E9EBF3" stroke-width="5"/>
    <circle cx="${tam / 2}" cy="${tam / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - pct / 100)}" transform="rotate(-90 ${tam / 2} ${tam / 2})"/>
    <text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700" fill="#1F2340" font-family="Figtree">${pct}%</text></svg>`;
}
function animarBarras() { requestAnimationFrame(() => requestAnimationFrame(() => $$('[data-w]').forEach(b => b.style.width = b.dataset.w + '%'))); }

/* ---------- Progreso de estudio ---------- */
const E = () => D.estudio || {};
function progreso(tid) {
  const e = E()[tid]; if (!e) return {lec: 0, prac: 0, exam: 0, total: 0};
  const lec = e.lecciones.filter((_, i) => leer(`lec:${tid}:${i}`)).length / Math.max(1, e.lecciones.length);
  const prac = e.practica.filter((_, i) => leer(`prac:${tid}:${i}`) === '1').length / Math.max(1, e.practica.length);
  const exam = (+leer(`exam:${tid}`) || 0) / 100;
  return {lec, prac, exam, total: Math.round((lec + prac + exam) / 3 * 100)};
}

/* ---------- Vistas ---------- */
let VISTA = 'inicio';
function iniciar() { $('#entrada').classList.add('oculto'); $('#app').classList.remove('oculto'); $('#nav').classList.remove('oculto'); ir('inicio'); }
function pintar(html) { $('#app').innerHTML = `<div class="vista">${html}</div>`; window.scrollTo(0, 0); animarBarras(); }
function marcarNav(v) { $$('nav.abajo button').forEach(b => b.dataset.ir === v ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current')); }
function ir(v, extra) {
  if ($('#hoja').classList.contains('on')) cerrarHoja(true);
  VISTA = v; marcarNav(v);
  ({inicio: vInicio, documentos: vDocumentos, estudiar: vEstudiar, examen: vExamen, tema: vTema}[v])(extra);
}

function vInicio() {
  const A = D.actividades, n = A.length;
  const ent = A.filter(a => a.estado === 'entregado').length, sub = A.filter(a => a.estado === 'por subir').length, hac = A.filter(a => a.estado === 'por hacer').length;
  const temasP = D.temas.map(t => ({t, p: progreso(t.id)}));
  const siguiente = temasP.find(x => x.p.total < 80) || temasP[0];
  pintar(`
    <div class="eyebrow">${esc(D.curso)} · ${esc(D.programa)}</div>
    <h1 class="titulo-vista">Hola, ${esc(D.estudiante)}</h1>
    <p class="bajada">Llevas <b>${n} trabajos</b> hechos y <b>${ent}</b> ya están en la plataforma.</p>

    <section class="panel" aria-labelledby="tAv">
      <h2 id="tAv">Tus trabajos</h2>
      <p class="sub">Toca un recuadro para ver esos trabajos.</p>
      <div class="barra-total" role="img" aria-label="${ent} entregados, ${sub} por subir, ${hac} por hacer">
        <i data-w="${ent / n * 100}" style="background:var(--ok)"></i><i data-w="${sub / n * 100}" style="background:var(--sube)"></i><i data-w="${hac / n * 100}" style="background:var(--hace)"></i>
      </div>
      <div class="estados3">
        <button class="est" style="--bg:#E3F3EA;--fg:#1F6B42" data-ir="documentos" data-filtro="entregado"><i class="ti ti-circle-check"></i><b data-n="${ent}">0</b><span>Entregados</span></button>
        <button class="est" style="--bg:#FFF0D9;--fg:#8A5410" data-ir="documentos" data-filtro="por subir"><i class="ti ti-cloud-upload"></i><b data-n="${sub}">0</b><span>Por subir</span></button>
        <button class="est" style="--bg:#ECEDF4;--fg:#5B5F7E" data-ir="documentos" data-filtro="por hacer"><i class="ti ti-pencil"></i><b data-n="${hac}">0</b><span>Por hacer</span></button>
      </div>
    </section>

    <button class="sigue" style="${varsTema(siguiente.t)}" data-ir="tema" data-tema="${siguiente.t.id}">
      <span class="ic"><i class="ti ti-player-play"></i></span>
      <span><span>Sigue estudiando</span><b>${esc(siguiente.t.nombre)}</b></span><i class="ti ti-chevron-right"></i></button>

    <section class="panel" aria-labelledby="tDom">
      <h2 id="tDom">¿Qué tan lista estás para el examen?</h2>
      <p class="sub">Sube leyendo las lecciones, resolviendo la práctica y haciendo simulacros.</p>
      <div class="dominio">${temasP.map(({t, p}) => `<button class="dom" style="${varsTema(t)}" data-ir="tema" data-tema="${t.id}">
        <span class="ic"><i class="ti ti-${esc(t.icono)}"></i></span>
        <span><b>${esc(t.nombre)}</b><span class="pista"><i data-w="${p.total}"></i></span></span><span class="pct">${p.total}%</span></button>`).join('')}</div>
    </section>
    <p class="pie">Actualizado el ${fecha(ACTUALIZADO.slice(0, 10))}</p>`);
  $$('[data-n]').forEach(el => contar(el, +el.dataset.n));
}

/* Documentos */
let FILTRO = 'todos', BUSCA = '';
function portada(a, t) {
  const pdf = a.archivos.find(f => f.ver);
  const img = pdf && pdf.portada ? `<img data-portada="${pdf.portada}" alt="">` : `<i class="ti ${TIPO_ARCH[a.archivos[0]?.tipo]?.ic || 'ti-file'} tipo-g"></i>`;
  return `<span class="portada">${img}<span class="sello estado ${estadoClase(a.estado)}"><i class="ti ${estadoIcono(a.estado)}"></i>${estadoTexto(a.estado)}</span></span>`;
}
function vDocumentos(extra) {
  if (extra && extra.filtro) FILTRO = extra.filtro;
  const filtros = [['todos', 'Todos'], ['por subir', 'Por subir'], ['entregado', 'Entregados'], ['por hacer', 'Por hacer']];
  pintar(`
    <div class="eyebrow">Biblioteca</div>
    <h1 class="titulo-vista">Aquí están tus documentos</h1>
    <p class="bajada">Todos los trabajos ordenados por tema. Tócalos para leerlos o descargarlos.</p>
    <div class="buscador"><input type="search" id="busca" placeholder="Buscar: brecha, nutrición, guía…" value="${esc(BUSCA)}" aria-label="Buscar documentos"></div>
    <div class="chips" role="group" aria-label="Filtrar">${filtros.map(([k, l]) => `<button class="chip" data-chip="${k}" aria-pressed="${FILTRO === k}">${l}</button>`).join('')}</div>
    <div id="estantes"></div>`);
  pintarEstantes();
  $('#busca').oninput = e => { BUSCA = e.target.value; pintarEstantes(); };
}
function pintarEstantes() {
  const q = BUSCA.trim().toLowerCase();
  const html = D.temas.map(t => {
    const as = actsDe(t.id).filter(a => (FILTRO === 'todos' || a.estado === FILTRO) && (!q || (a.titulo + ' ' + a.area + ' ' + a.tipo).toLowerCase().includes(q)));
    if (!as.length) return '';
    return `<section class="estante" style="${varsTema(t)}"><div class="estante-cab"><span class="pt"></span><h3>${esc(t.nombre)}</h3><span>${as.length} ${as.length === 1 ? 'documento' : 'documentos'}</span></div>
      <div class="docs">${as.map(a => `<button class="doc" data-act="${esc(a.num)}" data-pest="archivos">${portada(a, t)}
        <span class="info"><b>${esc(a.titulo)}</b><span>${esc(a.tipo)} · ${fecha(a.fecha)}</span></span></button>`).join('')}</div></section>`;
  }).join('');
  $('#estantes').innerHTML = html || '<div class="vacio">No hay documentos con ese filtro.</div>';
  cargarPortadas();
}
const PORTADAS = {};
async function cargarPortadas() {
  for (const img of $$('img[data-portada]')) {
    const id = img.dataset.portada;
    try {
      if (!PORTADAS[id]) { const r = await fetch('f/' + id + '.bin'); PORTADAS[id] = URL.createObjectURL(new Blob([await descifrar(await r.arrayBuffer())], {type: 'image/jpeg'})); }
      img.src = PORTADAS[id];
    } catch (e) {}
  }
}

/* Estudiar */
function vEstudiar() {
  pintar(`
    <div class="eyebrow">Para el examen</div>
    <h1 class="titulo-vista">Estudia tema por tema</h1>
    <p class="bajada">Cada tema tiene lecciones, un video corto, ejercicios con solución, juegos y tus trabajos.</p>
    <div class="temas-grid">${D.temas.map(t => { const e = E()[t.id] || {lecciones: [], practica: []}; const p = progreso(t.id);
      return `<button class="tema-c" style="${varsTema(t)}" data-ir="tema" data-tema="${t.id}"><span class="ic"><i class="ti ti-${esc(t.icono)}"></i></span>
        <span class="cod">Tema ${t.id}</span><h3>${esc(t.nombre)}</h3>
        <p class="meta">${e.lecciones.length} lecciones · ${e.practica.length} ejercicios</p>${anillo(p.total, fuerte(t.color))}</button>`; }).join('')}</div>`);
}

  const archivos = a.archivos.filter(f => !f.portadaDe).map(f => { const ti = TIPO_ARCH[f.tipo] || {ic: 'ti-file', nombre: 'Archivo'};
    return `<div class="archivo"><span class="tipo"><i class="ti ${ti.ic}"></i></span><span class="nom"><b>${f.generado ? 'PDF para leer' : ti.nombre}</b><span>${esc(f.nombre)} · ${kb(f.tam)}</span></span>
      ${f.ver ? `<button class="mini" data-ver="${f.id}" aria-label="Leer ${esc(f.nombre)}"><i class="ti ti-eye"></i></button>` : ''}
      <button class="mini" data-bajar="${f.id}" aria-label="Descargar ${esc(f.nombre)}"><i class="ti ti-download"></i></button></div>`; }).join('');
  const original = a.archivos.some(f => f.tipo === 'ipynb' || f.tipo === 'docx');
  const panelArch = `<div class="bloque"><h4><i class="ti ti-folder"></i>Archivos</h4>${archivos}</div>
    ${a.estado === 'por subir' && original ? `<div class="bloque"><h4><i class="ti ti-cloud-upload"></i>Para subirlo</h4><p>Descarga el archivo original y el PDF, y súbelos juntos en la tarea de la plataforma con el botón «Añadir envío».</p></div>` : ''}`;
  let panelRep = '<div class="vacio">La guía de repaso de este trabajo está en preparación.</div>';
  if (g) panelRep = `<div class="bloque"><h4><i class="ti ti-book"></i>Qué hiciste</h4><p>${esc(g.resumen)}</p></div>
    ${g.conceptos?.length ? `<div class="bloque"><h4><i class="ti ti-cards"></i>Conceptos clave</h4><p class="sub" style="margin:-4px 0 12px">Piensa qué significa y toca la tarjeta para comprobarlo.</p>
      <div class="cartas">${g.conceptos.map(c => `<button class="carta" aria-label="Concepto ${esc(c.t)}"><span class="in"><span class="cara frente"><small>Concepto</small>${esc(c.t)}</span><span class="cara reves">${esc(c.d)}</span></span></button>`).join('')}</div></div>` : ''}
    ${g.codigo?.length ? `<div class="bloque"><h4><i class="ti ti-code"></i>El código que usaste</h4><ul class="limpia codigo">${g.codigo.map(c => `<li><code>${esc(c.f)}</code><span>${esc(c.para)}</span></li>`).join('')}</ul></div>` : ''}
    ${g.hallazgos?.length ? `<div class="bloque"><h4><i class="ti ti-search"></i>Lo que encontraste</h4><ul class="limpia hallazgos">${g.hallazgos.map(h => `<li><i class="ti ti-point-filled"></i><span>${esc(h)}</span></li>`).join('')}</ul></div>` : ''}
    ${g.preguntas?.length ? `<div class="bloque"><h4><i class="ti ti-help-circle"></i>Pregúntate</h4>${g.preguntas.map(p => `<div class="ej" style="box-shadow:none;border:2px solid var(--linea);margin-top:10px"><p class="q" style="margin:0 0 10px">${esc(p.q)}</p>
      <div class="feedback bien oculto" style="margin:0 0 10px">${esc(p.a)}</div><button class="boton claro peq" data-revelar><i class="ti ti-eye"></i>Ver respuesta</button></div>`).join('')}</div>` : ''}`;
  abrirHoja(cabecera(esc(a.titulo), `${esc(t.nombre)} · ${estadoTexto(a.estado)}`) + `<div class="contenido">
    <div class="tabs" role="tablist" style="margin-top:0">
      <button role="tab" data-tab="repaso" aria-selected="${pest === 'repaso'}"><i class="ti ti-bulb"></i>Repasar</button>
      <button role="tab" data-tab="archivos" aria-selected="${pest === 'archivos'}"><i class="ti ti-download"></i>Archivos</button></div>
    <div data-panel="repaso" class="${pest === 'repaso' ? '' : 'oculto'}" style="margin-top:12px">${panelRep}</div>
    <div data-panel="archivos" class="${pest === 'archivos' ? '' : 'oculto'}" style="margin-top:12px">${panelArch}</div></div>`, varsTema(t));
  $('#hoja').dataset.act = num;
}

async function obtener(f) { const r = await fetch('f/' + f.id + '.bin'); if (!r.ok) throw new Error('red'); return new Blob([await descifrar(await r.arrayBuffer())], {type: f.mime}); }
function buscarArchivo(id) { for (const a of D.actividades) for (const f of a.archivos) if (f.id === id) return f; }
let pdfjs = null;
function cargarPdfjs() {
  if (pdfjs) return pdfjs;
  pdfjs = new Promise((ok, mal) => { const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    sc.onload = () => { pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; ok(pdfjsLib); };
    sc.onerror = () => { pdfjs = null; mal(new Error('red')); }; document.head.appendChild(sc); });
  return pdfjs;
}
async function ver(id) {
  const f = buscarArchivo(id), a = D.actividades.find(x => x.archivos.includes(f)), t = tema(a.tema), volver = $('#hoja').dataset.act;
  abrirHoja(cabecera(esc(a.titulo), 'Leyendo el PDF') + `<div class="contenido"><div class="acciones" style="margin:0 0 14px">
      ${volver ? `<button class="boton claro peq" data-act="${esc(volver)}" data-pest="archivos"><i class="ti ti-arrow-left"></i>Volver</button>` : ''}
      <button class="boton c peq" data-bajar="${f.id}"><i class="ti ti-download"></i>Descargar PDF</button></div>
    <div id="paginas"><div class="vacio"><i class="ti ti-loader-2 gira" style="font-size:28px"></i><br>Abriendo el documento…</div></div></div>`, varsTema(t));
  try {
    const [lib, blob] = await Promise.all([cargarPdfjs(), obtener(f)]);
    const doc = await lib.getDocument({data: new Uint8Array(await blob.arrayBuffer())}).promise;
    const cont = $('#paginas'); if (!cont) return; cont.innerHTML = '';
    const ancho = cont.clientWidth, escala = Math.min(2, window.devicePixelRatio || 1);
    for (let n = 1; n <= doc.numPages; n++) {
      if (!document.body.contains(cont)) return;
      const pag = await doc.getPage(n), v1 = pag.getViewport({scale: 1}), vp = pag.getViewport({scale: ancho / v1.width * escala});
      const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height; c.className = 'pagina'; c.setAttribute('aria-label', `Página ${n} de ${doc.numPages}`);
      cont.appendChild(c); await pag.render({canvasContext: c.getContext('2d'), viewport: vp}).promise;
    }
  } catch (e) { const cont = $('#paginas'); if (cont) cont.innerHTML = '<div class="vacio">No se pudo abrir el documento. Revisa el internet o usa «Descargar PDF».</div>'; }
}
async function bajar(id) {
  const f = buscarArchivo(id); toast('Descargando ' + f.nombre);
  try { const url = URL.createObjectURL(await obtener(f)); const a = document.createElement('a'); a.href = url; a.download = f.nombre; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 60000); }
  catch (e) { toast('No se pudo descargar. Revisa el internet.'); }
}

/* ---------- Clics ---------- */
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-num]'); if (!f) return; e.preventDefault();
  const art = f.closest('.ej'), x = E()[TEMA].practica[+art.dataset.ej], v = leerNumero(f.querySelector('input').value);
  if (isNaN(v)) { art.querySelector('.fb').innerHTML = '<div class="feedback mal">Escribe un número, por ejemplo 12.5</div>'; return; }
  const ok = Math.abs(v - x.respuesta) <= Math.max(x.tol, 1e-9);
  feedback(art, ok, x, ok ? '' : `La respuesta es <b>${fmt(x.respuesta)} ${esc(x.unidad || '')}</b>. Así se calcula:`);
});
document.addEventListener('click', e => {
  const el = e.target.closest('button'); if (!el || el.type === 'submit' && el.closest('form')) return;
  const d = el.dataset;
  if ('cerrar' in d) return cerrarHoja();
  if (d.ir) return ir(d.ir, {tema: d.tema, filtro: d.filtro});
  if (d.chip) { FILTRO = d.chip; $$('[data-chip]').forEach(b => b.setAttribute('aria-pressed', b === el)); return pintarEstantes(); }
  if (d.ver) return ver(d.ver);
  if (d.bajar) return bajar(d.bajar);
  if (d.act) return abrirAct(d.act, d.pest || 'repaso');
  if (d.ttab) { TAB = d.ttab; return pintarTab(); }
  if (d.lec) { LEC = +d.lec; pintarTab(); return $('.cab-tema').scrollIntoView({behavior: reducido() ? 'auto' : 'smooth'}); }
  if (d.seg) { const v = $('#vid'); if (v) { v.currentTime = +d.seg; v.play(); } return; }
  if (d.op !== undefined) {
    const art = el.closest('.ej'), x = E()[TEMA].practica[+art.dataset.ej], j = +d.op, ok = j === x.correcta;
    $$('.op', art).forEach(b => { b.disabled = true; if (+b.dataset.op === x.correcta) b.classList.add('bien'); });
    if (!ok) el.classList.add('mal');
    return feedback(art, ok, x, ok ? '' : `La correcta es la ${'ABCD'[x.correcta]}.`);
  }
  if (d.reinicia) return iniciarJuegos(E()[TEMA], d.reinicia);
  if (d.extema) { el.setAttribute('aria-pressed', el.getAttribute('aria-pressed') !== 'true'); return; }
  if (d.excant) { $$('[data-excant]').forEach(b => b.setAttribute('aria-pressed', b === el)); return; }
  if ('exempezar' in d) return empezarExamen();
  if ('exempezar2' in d) { ir('examen'); return; }
  if (d.exop !== undefined) return responderExamen(el);
  if ('exsig' in d) { EX.i++; return EX.i < EX.preguntas.length ? pintarPregunta() : resultadoExamen(); }
  if ('exsalir' in d) { clearInterval(reloj.h); return ir('examen'); }
  if (d.tab) { $$('#hoja [data-tab]').forEach(b => b.setAttribute('aria-selected', b === el)); $$('#hoja [data-panel]').forEach(p => p.classList.toggle('oculto', p.dataset.panel !== d.tab)); return; }
  if (el.classList.contains('carta')) return el.classList.toggle('vuelta');
  if ('revelar' in d) { el.previousElementSibling.classList.remove('oculto'); el.remove(); }
});
</script>
