<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F3F5FA">
<title>Portafolio · Análisis de Datos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{
  --fondo:#F3F5FA; --papel:#FFFFFF; --tinta:#1F2340; --suave:#5B5F7E; --tenue:#9A9DB5; --linea:#E1E4EF;
  --accion:#3B3F8F; --accion-hover:#2C2F72; --ok:#2E8B57; --sube:#D98A1E; --hace:#A9ACC2;
  --radio:18px; --sombra:0 1px 2px rgba(31,35,64,.06),0 8px 24px rgba(31,35,64,.06);
  --display:'Bricolage Grotesque',system-ui,sans-serif; --cuerpo:'Figtree',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fondo);color:var(--tinta);font-family:var(--cuerpo);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accion);outline-offset:3px;border-radius:10px}
.oculto{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.02em}

/* ---------- Entrada ---------- */
#entrada{min-height:100dvh;display:grid;place-items:center;padding:24px 16px;position:relative;overflow:hidden}
.puntos{position:absolute;inset:0;pointer-events:none}
.puntos span{position:absolute;width:var(--t);height:var(--t);border-radius:28%;background:var(--c);opacity:.9;animation:flota 9s ease-in-out infinite alternate;animation-delay:var(--d)}
@keyframes flota{to{transform:translate(var(--x),var(--y)) rotate(18deg)}}
.tarjeta-entrada{position:relative;background:var(--papel);border-radius:28px;box-shadow:var(--sombra);padding:32px 26px;width:min(400px,100%)}
.tarjeta-entrada h1{font-size:34px;line-height:1.05;font-weight:800}
.tarjeta-entrada p{color:var(--suave);margin:10px 0 22px}
label.campo{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.caja-clave{display:flex;gap:8px}
input[type=password],input[type=text].clave{flex:1;min-width:0;height:52px;border:2px solid var(--linea);border-radius:14px;padding:0 14px;font:inherit;font-size:17px;background:var(--fondo);color:var(--tinta)}
input:focus{outline:none;border-color:var(--accion)}
.ojo{width:52px;border:2px solid var(--linea);background:var(--papel);border-radius:14px;font-size:20px}
.recordar{display:flex;align-items:center;gap:8px;margin:14px 0 20px;font-size:14px;color:var(--suave)}
.recordar input{width:20px;height:20px;accent-color:var(--accion)}
.boton{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 22px;border-radius:14px;border:0;background:var(--accion);color:#fff;font-weight:600;font-size:16px;transition:background .15s,transform .1s}
.boton:hover{background:var(--accion-hover)}
.boton:active{transform:scale(.98)}
.boton.ancho{width:100%}
.boton.claro{background:var(--fondo);color:var(--tinta)}
.boton.claro:hover{background:var(--linea)}
.error{color:#B23A48;font-size:14px;margin-top:10px;min-height:20px}

/* ---------- App ---------- */
#app{max-width:760px;margin:0 auto;padding:20px 16px 110px}
.saludo{padding:12px 4px 4px}
.saludo .eyebrow{font-size:13px;font-weight:600;color:var(--suave);letter-spacing:.02em}
.saludo h1{font-size:clamp(34px,9vw,52px);font-weight:800;line-height:1;margin:6px 0 10px}
.saludo .frase{font-size:17px;color:var(--suave);margin:0}
.saludo .frase b{color:var(--tinta);font-weight:600}

.panel{background:var(--papel);border-radius:var(--radio);box-shadow:var(--sombra);padding:20px;margin-top:18px}
.panel h2{font-size:22px;font-weight:600}
.panel .sub{color:var(--suave);font-size:14px;margin:4px 0 0}

/* Mosaico: la firma */
.mosaico{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.fila-tema{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:10px}
.fila-tema .cod{font-family:var(--mono);font-size:12px;color:var(--suave)}
.fichas{display:flex;flex-wrap:wrap;gap:8px}
.ficha{width:40px;height:40px;border-radius:12px;border:2.5px solid var(--c);background:var(--c);position:relative;display:grid;place-items:center;color:#fff;font-size:18px;transition:transform .15s}
.ficha:hover{transform:translateY(-2px) scale(1.06)}
.ficha.sube{background:var(--papel);color:var(--c)}
.ficha.hace{background:transparent;border-style:dashed;color:var(--c)}
.ficha .estrella{position:absolute;top:-7px;right:-7px;width:18px;height:18px;border-radius:50%;background:#FFC83D;color:#5A3D00;font-size:11px;display:grid;place-items:center;border:2px solid var(--papel)}
.anima .ficha{animation:aparece .5s cubic-bezier(.2,.9,.3,1.3) both;animation-delay:calc(var(--i)*45ms)}
@keyframes aparece{from{opacity:0;transform:scale(.3) rotate(-12deg)}}
.leyenda{display:flex;flex-wrap:wrap;gap:14px;margin-top:16px;font-size:13px;color:var(--suave)}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i.m{width:14px;height:14px;border-radius:5px;border:2px solid var(--tinta);display:inline-block}
.leyenda i.m.ll{background:var(--tinta)}
.leyenda i.m.ds{border-style:dashed}

.cifras{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.cifra{border-radius:14px;padding:12px;background:var(--fondo)}
.cifra b{display:block;font-family:var(--display);font-size:30px;font-weight:800;line-height:1}
.cifra span{font-size:13px;color:var(--suave)}

.siguiente{display:flex;gap:14px;align-items:center;background:#FFF4E2;border-radius:var(--radio);padding:16px 18px;margin-top:18px;border:0;width:100%;text-align:left}
.siguiente .ic{width:44px;height:44px;border-radius:14px;background:var(--sube);color:#fff;display:grid;place-items:center;font-size:22px;flex:none}
.siguiente b{display:block;font-size:16px}
.siguiente span{font-size:14px;color:#7A5212}
.siguiente .ti-chevron-right{margin-left:auto;font-size:22px;color:#7A5212}

/* Temas como pestañas de cuaderno */
.temas{margin-top:26px}
.temas h2{font-size:24px;font-weight:600;padding:0 4px 10px}
.tema{display:block;width:100%;text-align:left;border:0;background:var(--papel);border-radius:var(--radio);box-shadow:var(--sombra);margin-bottom:12px;padding:0;overflow:hidden;position:relative}
.tema .pest{display:flex;align-items:center;gap:14px;padding:16px 18px 16px 22px;border-left:8px solid var(--c)}
.tema .ic{width:46px;height:46px;border-radius:14px;background:var(--cs);color:var(--c);display:grid;place-items:center;font-size:24px;flex:none}
.tema h3{font-size:18px;font-weight:600;line-height:1.2}
.tema .idea{font-size:14px;color:var(--suave);margin-top:2px}
.tema .barra{height:6px;border-radius:3px;background:var(--fondo);margin-top:10px;overflow:hidden}
.tema .barra i{display:block;height:100%;width:0;background:var(--c);border-radius:3px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.tema .cuenta{font-size:13px;font-weight:600;color:var(--c);margin-left:auto;white-space:nowrap;align-self:flex-start}
.tema .cuerpo{flex:1;min-width:0}

/* Barra inferior */
nav.abajo{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));background:var(--tinta);border-radius:22px;padding:6px;display:flex;gap:4px;box-shadow:0 10px 30px rgba(31,35,64,.25);z-index:20}
nav.abajo button{border:0;background:transparent;color:#C9CBE0;border-radius:16px;padding:8px 14px;white-space:nowrap;display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:600;gap:2px}
nav.abajo button i{font-size:22px}
nav.abajo button[aria-current=page]{background:#fff;color:var(--tinta)}

/* Hoja (tema / actividad) */
.velo{position:fixed;inset:0;background:rgba(31,35,64,.35);z-index:30;opacity:0;transition:opacity .25s}
.velo.on{opacity:1}
.hoja{position:fixed;left:0;right:0;bottom:0;max-height:92dvh;min-height:72dvh;overflow:auto;background:var(--fondo);border-radius:28px 28px 0 0;z-index:31;transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
.hoja.on{transform:none}
@media(min-width:800px){.hoja{left:50%;right:auto;width:760px;margin-left:-380px}}
.cab{position:sticky;top:0;z-index:2;padding:12px 18px 16px;background:var(--c);color:#fff}
.cab .asa{width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.55);margin:0 auto 12px}
.cab .fila{display:flex;align-items:flex-start;gap:12px}
.cab h2{font-size:24px;font-weight:800;line-height:1.1}
.cab .meta{font-size:14px;opacity:.9;margin-top:4px}
.cerrar{margin-left:auto;border:0;background:rgba(255,255,255,.22);color:#fff;width:40px;height:40px;border-radius:12px;font-size:22px;flex:none;display:grid;place-items:center}
.contenido{padding:16px 16px 40px}

.act{background:var(--papel);border-radius:var(--radio);box-shadow:var(--sombra);padding:16px;margin-bottom:12px}
.act .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.etq{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--fondo);color:var(--suave)}
.estado{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:4px}
.estado.entregado{background:#E3F3EA;color:#1F6B42}
.estado.sube{background:#FFF0D9;color:#8A5410}
.estado.hace{background:#ECEDF4;color:#5B5F7E}
.act h3{font-size:18px;font-weight:600;margin:10px 0 2px;line-height:1.25}
.act .fecha{font-size:13px;color:var(--tenue)}
.acciones{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.acciones .boton{height:44px;padding:0 16px;font-size:15px;border-radius:12px}
.acciones .boton.c{background:var(--c)}
.acciones .boton.c:hover{filter:brightness(.92)}

.pestanas{display:flex;background:var(--papel);border-radius:14px;padding:4px;margin-bottom:16px;box-shadow:var(--sombra)}
.pestanas button{flex:1;border:0;background:transparent;padding:10px;border-radius:11px;font-weight:600;color:var(--suave);display:flex;align-items:center;justify-content:center;gap:6px}
.pestanas button[aria-selected=true]{background:var(--c);color:#fff}

.bloque{background:var(--papel);border-radius:var(--radio);padding:18px;margin-bottom:14px;box-shadow:var(--sombra)}
.bloque h4{font-family:var(--display);font-size:17px;font-weight:600;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.bloque h4 i{color:var(--c);font-size:20px}
.bloque p{margin:0}
.archivo{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--linea)}
.archivo:first-of-type{border-top:0}
.archivo .tipo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex:none;background:var(--cs);color:var(--c)}
.archivo .nom{flex:1;min-width:0}
.archivo .nom b{display:block;font-size:15px;font-weight:600}
.archivo .nom span{font-size:13px;color:var(--suave)}
.mini{border:0;background:var(--fondo);border-radius:12px;width:44px;height:44px;font-size:20px;display:grid;place-items:center;flex:none}
.mini:hover{background:var(--linea)}

.cartas{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.carta{perspective:800px;height:150px;border:0;background:transparent;padding:0;display:block;width:100%}
.carta .in{display:block;position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.carta.vuelta .in{transform:rotateY(180deg)}
.carta .cara{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:12px;display:flex;align-items:center;justify-content:center;text-align:center}
.carta .frente{background:var(--cs);color:var(--tinta);font-family:var(--display);font-weight:600;font-size:17px;flex-direction:column;gap:6px}
.carta .frente small{font-family:var(--cuerpo);font-size:11px;font-weight:600;color:var(--c)}
.carta .reves{background:var(--c);color:#fff;transform:rotateY(180deg);font-size:13.5px;line-height:1.35;overflow:auto}
.codigo li{display:flex;flex-direction:column;padding:8px 0;border-top:1px solid var(--linea)}
.codigo li:first-child{border-top:0}
.codigo code{font-family:var(--mono);font-size:13.5px;color:var(--c);word-break:break-word}
.codigo span{font-size:14px;color:var(--suave)}
ul.limpia{list-style:none;margin:0;padding:0}
.hallazgos li{display:flex;gap:10px;padding:6px 0}
.hallazgos li i{color:var(--c);font-size:20px;flex:none;margin-top:1px}

.pregunta{border:2px solid var(--linea);border-radius:16px;padding:14px;margin-bottom:10px;transition:border-color .2s}
.pregunta.ok{border-color:var(--ok)}
.pregunta.otra{border-color:var(--sube)}
.pregunta p.q{font-weight:600;margin-bottom:10px}
.pregunta .r{background:var(--fondo);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:15px}
.pregunta .botones{display:flex;gap:8px;flex-wrap:wrap}
.pregunta .botones .boton{height:40px;font-size:14px;padding:0 14px;border-radius:11px}
.logro{display:flex;gap:12px;align-items:center;background:#FFF7DB;border-radius:16px;padding:14px;margin-top:6px}
.logro i{font-size:28px;color:#C08A00}

.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:var(--tinta);color:#fff;padding:12px 18px;border-radius:14px;font-size:15px;opacity:0;transition:all .3s;z-index:50;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.confeti{position:fixed;pointer-events:none;z-index:60;width:10px;height:10px;border-radius:3px}

.pagina{display:block;width:100%;height:auto;background:#fff;border-radius:8px;box-shadow:var(--sombra);margin-bottom:12px}
.gira{display:inline-block;animation:gira 1s linear infinite}@keyframes gira{to{transform:rotate(360deg)}}
.vacio{text-align:center;color:var(--suave);padding:30px 10px}
.pie{text-align:center;color:var(--tenue);font-size:12px;margin-top:30px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<section id="entrada">
  <div class="puntos" aria-hidden="true">
    <span style="--t:90px;--c:#E07A5F;left:6%;top:10%;--x:20px;--y:30px;--d:0s"></span>
    <span style="--t:60px;--c:#2A9D8F;right:10%;top:14%;--x:-30px;--y:20px;--d:-2s"></span>
    <span style="--t:110px;--c:#8E7DBE;left:-20px;bottom:12%;--x:30px;--y:-20px;--d:-4s"></span>
    <span style="--t:70px;--c:#E9A23B;right:-10px;bottom:20%;--x:-20px;--y:-30px;--d:-1s"></span>
    <span style="--t:46px;--c:#D1607A;left:40%;top:4%;--x:10px;--y:24px;--d:-3s"></span>
    <span style="--t:54px;--c:#3D7DCA;left:22%;bottom:4%;--x:24px;--y:-14px;--d:-5s"></span>
    <span style="--t:38px;--c:#5E9E4F;right:28%;bottom:6%;--x:-16px;--y:-20px;--d:-6s"></span>
  </div>
  <form class="tarjeta-entrada" id="formEntrada" autocomplete="on">
    <h1>Tu portafolio de Análisis de Datos</h1>
    <p>Aquí están todos tus trabajos, cómo vas y una guía para repasar cada uno.</p>
    <input type="text" name="username" value="portafolio" autocomplete="username" class="sr" tabindex="-1" aria-hidden="true">
    <label class="campo" for="clave">Contraseña</label>
    <div class="caja-clave">
      <input id="clave" type="password" autocomplete="current-password" required>
      <button type="button" class="ojo" id="ojo" aria-label="Mostrar contraseña"><i class="ti ti-eye"></i></button>
    </div>
    <label class="recordar"><input type="checkbox" id="recordar" checked> Recordarla en este dispositivo</label>
    <button class="boton ancho" type="submit" id="btnEntrar"><span>Entrar</span><i class="ti ti-arrow-right"></i></button>
    <div class="error" id="error" role="alert"></div>
  </form>
</section>

<main id="app" class="oculto"></main>

<nav class="abajo oculto" id="nav" aria-label="Secciones">
  <button data-ir="inicio" aria-current="page"><i class="ti ti-layout-grid"></i>Inicio</button>
  <button data-ir="subir"><i class="ti ti-cloud-upload"></i>Por subir</button>
  <button data-ir="repaso"><i class="ti ti-cards"></i>Repasar</button>
</nav>

<div class="velo oculto" id="velo"></div>
<div class="hoja" id="hoja" role="dialog" aria-modal="true" aria-labelledby="hojaTitulo"></div>
<div class="toast" id="toast" role="status"></div>

<script>
const SAL = "A807s3xsZKVRAqBmQeFJyg==";
const ITER = 250000;
const ACTUALIZADO = "2026-10-18T1731";

const $ = (s, r = document) => r.querySelector(s);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const aB64 = u => btoa(String.fromCharCode(...new Uint8Array(u)));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const leer = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };

let LLAVE = null, D = null;

async function derivar(clave) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(clave), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(SAL), iterations: ITER, hash: 'SHA-256'},
    base, {name: 'AES-GCM', length: 256}, true, ['decrypt']);
}
async function descifrar(buf) {
  const u = new Uint8Array(buf);
  return crypto.subtle.decrypt({name: 'AES-GCM', iv: u.slice(0, 12)}, LLAVE, u.slice(12));
}
async function cargarDatos() {
  const r = await fetch('datos.bin?v=' + ACTUALIZADO, {cache: 'no-store'});
  if (!r.ok) throw new Error('red');
  const plano = await descifrar(await r.arrayBuffer());
  return JSON.parse(new TextDecoder().decode(plano));
}

/* ---------- Entrada ---------- */
$('#ojo').onclick = () => {
  const i = $('#clave'); const ver = i.type === 'password';
  i.type = ver ? 'text' : 'password';
  $('#ojo').innerHTML = `<i class="ti ti-eye${ver ? '-off' : ''}"></i>`;
  $('#ojo').setAttribute('aria-label', ver ? 'Ocultar contraseña' : 'Mostrar contraseña');
};
$('#clave').oninput = () => { $('#error').textContent = ''; };
$('#formEntrada').onsubmit = async e => {
  e.preventDefault();
  const clave = $('#clave').value;
  if (!clave) { $('#error').textContent = 'Escribe la contraseña para entrar.'; return; }
  $('#btnEntrar').firstElementChild.textContent = 'Abriendo…';
  try {
    LLAVE = await derivar(clave);
    D = await cargarDatos();
    if ($('#recordar').checked) guardar('llave', aB64(await crypto.subtle.exportKey('raw', LLAVE)) + '|' + SAL);
    iniciar();
  } catch (err) {
    LLAVE = null;
    $('#error').textContent = err.message === 'red'
      ? 'No se pudo conectar. Revisa el internet e inténtalo de nuevo.'
      : 'Esa contraseña no es la correcta. Revísala e inténtalo otra vez.';
    $('#btnEntrar').firstElementChild.textContent = 'Entrar';
  }
};
(async () => {
  const g = leer('llave');
  if (!g) return;
  const [k, s] = g.split('|');
  if (s !== SAL) return;
  try {
    LLAVE = await crypto.subtle.importKey('raw', b64(k), 'AES-GCM', true, ['decrypt']);
    D = await cargarDatos();
    iniciar();
  } catch (e) { LLAVE = null; }
})();

/* ---------- Utilidades de contenido ---------- */
const TIPO_ARCH = {
  pdf: {ic: 'ti-file-type-pdf', nombre: 'PDF para leer'},
  ipynb: {ic: 'ti-notebook', nombre: 'Notebook (archivo original)'},
  docx: {ic: 'ti-file-type-doc', nombre: 'Word (archivo original)'},
  csv: {ic: 'ti-table', nombre: 'Datos en CSV'}
};
const estadoClase = e => e === 'entregado' ? 'entregado' : e === 'por subir' ? 'sube' : 'hace';
const estadoTexto = e => e === 'entregado' ? 'Entregado' : e === 'por subir' ? 'Por subir' : 'Por hacer';
const estadoIcono = e => e === 'entregado' ? 'ti-check' : e === 'por subir' ? 'ti-cloud-upload' : 'ti-pencil';
const tema = id => D.temas.find(t => t.id === id);
const actsDe = id => D.actividades.filter(a => a.tema === id);
const repasado = a => leer('rep:' + a.num) === '1';
const fecha = f => f ? new Date(f + 'T12:00').toLocaleDateString('es', {day: 'numeric', month: 'long'}) : '';
const kb = n => n > 1e6 ? (n / 1e6).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1e3)) + ' KB';
function suave(hex, a = .14) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
}
function varsTema(t) { return `--c:${t.color};--cs:${suave(t.color)}`; }

function toast(m) {
  const t = $('#toast'); t.textContent = m; t.classList.add('on');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 2600);
}
function confeti(x, y) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cols = D.temas.map(t => t.color);
  for (let i = 0; i < 26; i++) {
    const p = document.createElement('i'); p.className = 'confeti';
    p.style.background = cols[i % cols.length]; p.style.left = x + 'px'; p.style.top = y + 'px';
    document.body.appendChild(p);
    const ang = Math.random() * Math.PI * 2, dist = 60 + Math.random() * 110;
    p.animate([{transform: 'translate(0,0) rotate(0)', opacity: 1},
      {transform: `translate(${Math.cos(ang) * dist}px,${Math.sin(ang) * dist + 60}px) rotate(${Math.random() * 540}deg)`, opacity: 0}],
      {duration: 900 + Math.random() * 500, easing: 'cubic-bezier(.2,.8,.3,1)'}).onfinish = () => p.remove();
  }
}

/* ---------- Pantallas ---------- */
function iniciar() {
  $('#entrada').classList.add('oculto');
  $('#app').classList.remove('oculto');
  $('#nav').classList.remove('oculto');
  pintarInicio(true);
}

function pintarInicio(animar) {
  const A = D.actividades;
  const ent = A.filter(a => a.estado === 'entregado').length;
  const sub = A.filter(a => a.estado === 'por subir').length;
  const hac = A.filter(a => a.estado === 'por hacer').length;
  const rep = A.filter(repasado).length;
  const filas = D.temas.map(t => {
    const fichas = actsDe(t.id).map(a => {
      const c = estadoClase(a.estado);
      return `<button class="ficha ${c === 'entregado' ? '' : c}" style="${varsTema(t)};--i:${A.indexOf(a)}"
        data-act="${esc(a.num)}" aria-label="${esc(a.titulo)}: ${estadoTexto(a.estado)}">
        <i class="ti ${estadoIcono(a.estado)}"></i>${repasado(a) ? '<span class="estrella"><i class="ti ti-star"></i></span>' : ''}</button>`;
    }).join('');
    return `<div class="fila-tema"><span class="cod">${t.id}</span><div class="fichas">${fichas}</div></div>`;
  }).join('');

  const temas = D.temas.map(t => {
    const as = actsDe(t.id); const listos = as.filter(a => a.estado !== 'por hacer').length;
    const pct = as.length ? Math.round(as.filter(a => a.estado === 'entregado').length / as.length * 100) : 0;
    return `<button class="tema" style="${varsTema(t)}" data-tema="${t.id}">
      <div class="pest"><div class="ic"><i class="ti ti-${esc(t.icono)}"></i></div>
      <div class="cuerpo"><h3>${esc(t.nombre)}</h3><div class="idea">${esc(t.idea)}</div>
      <div class="barra"><i data-w="${pct}"></i></div></div>
      <span class="cuenta">${listos} de ${as.length} hechos</span></div></button>`;
  }).join('');

  $('#app').innerHTML = `
    <header class="saludo">
      <div class="eyebrow">${esc(D.curso)} · ${esc(D.programa)}</div>
      <h1>Hola, ${esc(D.estudiante)}</h1>
      <p class="frase">Llevas <b>${A.length} trabajos</b>${ent ? `, y <b>${ent}</b> ya están en la plataforma` : ''}.</p>
    </header>
    <section class="panel ${animar ? 'anima' : ''}" aria-labelledby="tMosaico">
      <h2 id="tMosaico">Tu mosaico</h2>
      <p class="sub">Cada cuadrito es un trabajo, con el color de su tema. Tócalo para abrirlo.</p>
      <div class="mosaico">${filas}</div>
      <div class="leyenda">
        <span><i class="m ll"></i>Entregado</span><span><i class="m"></i>Listo, falta subirlo</span>
        <span><i class="m ds"></i>Por hacer</span><span><i class="ti ti-star" style="color:#C08A00"></i>Ya lo repasaste</span>
      </div>
      <div class="cifras">
        <div class="cifra"><b data-n="${ent}">0</b><span>entregados</span></div>
        <div class="cifra"><b data-n="${sub}">0</b><span>por subir</span></div>
        <div class="cifra"><b data-n="${rep}">0</b><span>repasados</span></div>
      </div>
    </section>
    ${sub ? `<button class="siguiente" data-ir="subir"><span class="ic"><i class="ti ti-cloud-upload"></i></span>
      <span><b>${sub === 1 ? 'Tienes 1 trabajo listo para subir' : `Tienes ${sub} trabajos listos para subir`}</b>
      <span>Descárgalos y súbelos a la plataforma</span></span><i class="ti ti-chevron-right"></i></button>` : ''}
    ${hac ? `<p class="sub" style="margin:12px 6px 0">${hac === 1 ? 'Falta 1 trabajo por hacer.' : `Faltan ${hac} trabajos por hacer.`}</p>` : ''}
    <section class="temas" aria-labelledby="tTemas"><h2 id="tTemas">Temas del curso</h2>${temas}</section>
    <p class="pie">Actualizado el ${fecha(ACTUALIZADO.slice(0, 10))}</p>`;

  requestAnimationFrame(() => {
    document.querySelectorAll('.tema .barra i').forEach(b => b.style.width = b.dataset.w + '%');
    document.querySelectorAll('[data-n]').forEach(el => contar(el, +el.dataset.n, animar));
  });
}
function contar(el, n, animar) {
  if (!animar || matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = n; return; }
  const t0 = performance.now();
  const paso = t => { const k = Math.min(1, (t - t0) / 900); el.textContent = Math.round(n * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(paso); };
  requestAnimationFrame(paso);
}

/* ---------- Hoja ---------- */
let foco = null;
function abrirHoja(html, color) {
  foco = document.activeElement;
  const h = $('#hoja'); h.style.cssText = color; h.innerHTML = html; h.scrollTop = 0;
  $('#velo').classList.remove('oculto');
  requestAnimationFrame(() => { $('#velo').classList.add('on'); h.classList.add('on'); });
  setTimeout(() => { const c = h.querySelector('.cerrar'); c && c.focus(); }, 60);
  document.body.style.overflow = 'hidden';
}
function cerrarHoja() {
  $('#velo').classList.remove('on'); $('#hoja').classList.remove('on');
  setTimeout(() => $('#velo').classList.add('oculto'), 250);
  document.body.style.overflow = '';
  pintarInicio(false);
  marcarNav('inicio');
  foco && foco.focus && foco.focus();
}
$('#velo').onclick = cerrarHoja;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#hoja').classList.contains('on')) cerrarHoja(); });

function cabecera(titulo, meta) {
  return `<div class="cab"><div class="asa"></div><div class="fila"><div><h2 id="hojaTitulo">${titulo}</h2>
    <div class="meta">${meta}</div></div><button class="cerrar" data-cerrar aria-label="Cerrar"><i class="ti ti-x"></i></button></div></div>`;
}
function tarjetaAct(a) {
  const t = tema(a.tema); const pdf = a.archivos.find(f => f.ver);
  return `<article class="act" style="${varsTema(t)}">
    <div class="top"><span class="etq">${esc(a.tipo)}</span><span class="etq">${esc(a.area)}</span>
      <span class="estado ${estadoClase(a.estado)}"><i class="ti ${estadoIcono(a.estado)}"></i>${estadoTexto(a.estado)}</span>
      ${repasado(a) ? '<span class="etq" style="background:#FFF7DB;color:#7A5A00"><i class="ti ti-star"></i> Repasado</span>' : ''}</div>
    <h3>${esc(a.titulo)}</h3><div class="fecha">${fecha(a.fecha)}</div>
    <div class="acciones">
      ${pdf ? `<button class="boton c" data-ver="${pdf.id}"><i class="ti ti-eye"></i>Leer</button>` : ''}
      <button class="boton claro" data-act="${esc(a.num)}" data-pest="archivos"><i class="ti ti-download"></i>Descargar</button>
      <button class="boton claro" data-act="${esc(a.num)}" data-pest="repaso"><i class="ti ti-bulb"></i>Repasar</button>
    </div></article>`;
}
function abrirTema(id) {
  const t = tema(id); const as = actsDe(id);
  abrirHoja(cabecera(esc(t.nombre), `Tema ${t.id} · ${as.length} ${as.length === 1 ? 'trabajo' : 'trabajos'}`) +
    `<div class="contenido">${as.map(tarjetaAct).join('') || '<div class="vacio">Este tema todavía no tiene trabajos.</div>'}</div>`, varsTema(t));
}
function abrirLista(titulo, meta, lista, vacio) {
  abrirHoja(`<div style="--c:var(--tinta)">${cabecera(titulo, meta)}</div>` +
    `<div class="contenido">${lista.map(tarjetaAct).join('') || `<div class="vacio">${vacio}</div>`}</div>`, '--c:#1F2340;--cs:#ECEDF4');
}

function abrirAct(num, pest = 'repaso') {
  const a = D.actividades.find(x => x.num === num); const t = tema(a.tema);
  const g = a.guia;
  const archivos = a.archivos.map(f => {
    const ti = TIPO_ARCH[f.tipo] || {ic: 'ti-file', nombre: 'Archivo'};
    return `<div class="archivo"><span class="tipo"><i class="ti ${ti.ic}"></i></span>
      <span class="nom"><b>${f.generado ? 'PDF para leer' : ti.nombre}</b><span>${esc(f.nombre)} · ${kb(f.tam)}</span></span>
      ${f.ver ? `<button class="mini" data-ver="${f.id}" aria-label="Leer ${esc(f.nombre)}"><i class="ti ti-eye"></i></button>` : ''}
      <button class="mini" data-bajar="${f.id}" aria-label="Descargar ${esc(f.nombre)}"><i class="ti ti-download"></i></button></div>`;
  }).join('');
  const original = a.archivos.some(f => f.tipo === 'ipynb' || f.tipo === 'docx');
  const panelArch = `<div class="bloque"><h4><i class="ti ti-folder"></i>Archivos</h4>${archivos}</div>
    ${a.estado === 'por subir' && original ? `<div class="bloque"><h4><i class="ti ti-cloud-upload"></i>Para subirlo</h4>
      <p>Descarga el archivo original y el PDF, y súbelos juntos en la tarea de la plataforma con el botón «Añadir envío».</p></div>` : ''}`;

  let panelRep = '<div class="vacio">La guía de repaso de este trabajo está en preparación.</div>';
  if (g) {
    const cartas = (g.conceptos || []).map(c => `<button class="carta" aria-label="Concepto ${esc(c.t)}. Toca para ver la definición">
      <span class="in"><span class="cara frente"><small>Concepto</small>${esc(c.t)}</span><span class="cara reves">${esc(c.d)}</span></span></button>`).join('');
    const cod = (g.codigo || []).map(c => `<li><code>${esc(c.f)}</code><span>${esc(c.para)}</span></li>`).join('');
    const hall = (g.hallazgos || []).map(h => `<li><i class="ti ti-point-filled"></i><span>${esc(h)}</span></li>`).join('');
    const preg = (g.preguntas || []).map((p, i) => `<div class="pregunta" data-i="${i}"><p class="q">${esc(p.q)}</p>
      <div class="r oculto">${esc(p.a)}</div>
      <div class="botones"><button class="boton claro" data-revelar><i class="ti ti-eye"></i>Ver respuesta</button></div></div>`).join('');
    panelRep = `<div class="bloque"><h4><i class="ti ti-book"></i>Qué hiciste</h4><p>${esc(g.resumen)}</p></div>
      ${cartas ? `<div class="bloque"><h4><i class="ti ti-cards"></i>Conceptos clave</h4>
        <p class="sub" style="margin:-4px 0 12px">Piensa qué significa y toca la tarjeta para comprobarlo.</p><div class="cartas">${cartas}</div></div>` : ''}
      ${cod ? `<div class="bloque"><h4><i class="ti ti-code"></i>El código que usaste</h4><ul class="limpia codigo">${cod}</ul></div>` : ''}
      ${hall ? `<div class="bloque"><h4><i class="ti ti-search"></i>Lo que encontraste</h4><ul class="limpia hallazgos">${hall}</ul></div>` : ''}
      ${preg ? `<div class="bloque" id="quiz"><h4><i class="ti ti-help-circle"></i>Ponte a prueba</h4>${preg}
        <div id="logro">${repasado(a) ? logroHTML() : ''}</div></div>` : ''}`;
  }
  abrirHoja(cabecera(esc(a.titulo), `${esc(t.nombre)} · ${estadoTexto(a.estado)}`) + `<div class="contenido">
    <div class="pestanas" role="tablist">
      <button role="tab" data-tab="repaso" aria-selected="${pest === 'repaso'}"><i class="ti ti-bulb"></i>Repasar</button>
      <button role="tab" data-tab="archivos" aria-selected="${pest === 'archivos'}"><i class="ti ti-download"></i>Archivos</button></div>
    <div data-panel="repaso" class="${pest === 'repaso' ? '' : 'oculto'}">${panelRep}</div>
    <div data-panel="archivos" class="${pest === 'archivos' ? '' : 'oculto'}">${panelArch}</div></div>`, varsTema(t));
  $('#hoja').dataset.act = num;
}
const logroHTML = () => `<div class="logro"><i class="ti ti-star"></i><div><b>¡Repaso completo!</b><br><span class="sub">Este trabajo ya tiene su estrella en el mosaico.</span></div></div>`;

/* ---------- Repaso rápido ---------- */
function abrirRepaso() {
  const todas = [];
  D.actividades.forEach(a => (a.guia?.preguntas || []).forEach(p => todas.push({a, p})));
  for (let i = todas.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [todas[i], todas[j]] = [todas[j], todas[i]]; }
  const sel = todas.slice(0, 6);
  abrirHoja(`<div>${cabecera('Repaso rápido', 'Seis preguntas al azar de todo el curso')}</div><div class="contenido">
    ${sel.map(({a, p}, i) => { const t = tema(a.tema); return `<div class="bloque" style="${varsTema(t)}">
      <h4><i class="ti ti-${esc(t.icono)}"></i>${esc(a.titulo)}</h4>
      <div class="pregunta" style="margin:0"><p class="q">${esc(p.q)}</p><div class="r oculto">${esc(p.a)}</div>
      <div class="botones"><button class="boton claro" data-revelar><i class="ti ti-eye"></i>Ver respuesta</button></div></div></div>`; }).join('')}
    <button class="boton ancho" data-ir="repaso"><i class="ti ti-refresh"></i>Otras seis preguntas</button></div>`, '--c:#1F2340;--cs:#ECEDF4');
}

/* ---------- Archivos ---------- */
async function obtener(f) {
  const r = await fetch('f/' + f.id + '.bin');
  if (!r.ok) throw new Error('red');
  return new Blob([await descifrar(await r.arrayBuffer())], {type: f.mime});
}
function buscarArchivo(id) { for (const a of D.actividades) for (const f of a.archivos) if (f.id === id) return f; }
let pdfjs = null;
function cargarPdfjs() {
  if (pdfjs) return pdfjs;
  pdfjs = new Promise((ok, mal) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    sc.onload = () => { pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; ok(pdfjsLib); };
    sc.onerror = () => { pdfjs = null; mal(new Error('red')); };
    document.head.appendChild(sc);
  });
  return pdfjs;
}
async function ver(id) {
  const f = buscarArchivo(id);
  const a = D.actividades.find(x => x.archivos.includes(f)); const t = tema(a.tema);
  const volver = $('#hoja').dataset.act;
  abrirHoja(cabecera(esc(a.titulo), 'Leyendo el PDF') + `<div class="contenido lector">
    <div class="acciones" style="margin:0 0 14px">
      ${volver ? `<button class="boton claro" data-act="${esc(volver)}" data-pest="archivos"><i class="ti ti-arrow-left"></i>Volver</button>` : ''}
      <button class="boton c" data-bajar="${f.id}"><i class="ti ti-download"></i>Descargar PDF</button></div>
    <div id="paginas"><div class="vacio"><i class="ti ti-loader-2 gira" style="font-size:28px"></i><br>Abriendo el documento…</div></div></div>`, varsTema(t));
  try {
    const [lib, blob] = await Promise.all([cargarPdfjs(), obtener(f)]);
    const doc = await lib.getDocument({data: new Uint8Array(await blob.arrayBuffer())}).promise;
    const cont = $('#paginas'); if (!cont) return;
    cont.innerHTML = '';
    const ancho = cont.clientWidth, escala = Math.min(2, window.devicePixelRatio || 1);
    for (let n = 1; n <= doc.numPages; n++) {
      if (!document.body.contains(cont)) return;
      const pag = await doc.getPage(n);
      const v1 = pag.getViewport({scale: 1}); const vp = pag.getViewport({scale: ancho / v1.width * escala});
      const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
      c.className = 'pagina'; c.setAttribute('aria-label', `Página ${n} de ${doc.numPages}`);
      cont.appendChild(c);
      await pag.render({canvasContext: c.getContext('2d'), viewport: vp}).promise;
    }
  } catch (e) {
    const cont = $('#paginas');
    if (cont) cont.innerHTML = '<div class="vacio">No se pudo abrir el documento. Revisa el internet o usa «Descargar PDF».</div>';
  }
}
async function bajar(id) {
  const f = buscarArchivo(id);
  toast('Descargando ' + f.nombre);
  try {
    const url = URL.createObjectURL(await obtener(f));
    const a = document.createElement('a'); a.href = url; a.download = f.nombre;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (e) { toast('No se pudo descargar. Revisa el internet.'); }
}

/* ---------- Navegación ---------- */
function marcarNav(ir) { document.querySelectorAll('nav.abajo button').forEach(b => b.toggleAttribute('aria-current', b.dataset.ir === ir)); document.querySelectorAll('nav.abajo button[aria-current]').forEach(b => b.setAttribute('aria-current', 'page')); }
function ir(dest) {
  marcarNav(dest);
  if (dest === 'inicio') { if ($('#hoja').classList.contains('on')) cerrarHoja(); else window.scrollTo({top: 0, behavior: 'smooth'}); }
  if (dest === 'subir') abrirLista('Por subir', 'Trabajos listos que falta subir a la plataforma', D.actividades.filter(a => a.estado === 'por subir'), 'No tienes trabajos pendientes por subir.');
  if (dest === 'repaso') abrirRepaso();
}
document.addEventListener('click', e => {
  const el = e.target.closest('button'); if (!el) return;
  if (el.matches('[data-cerrar]')) return cerrarHoja();
  if (el.dataset.ir) return ir(el.dataset.ir);
  if (el.dataset.tema) return abrirTema(el.dataset.tema);
  if (el.dataset.ver) return ver(el.dataset.ver);
  if (el.dataset.bajar) return bajar(el.dataset.bajar);
  if (el.dataset.act) return abrirAct(el.dataset.act, el.dataset.pest || 'repaso');
  if (el.dataset.tab) {
    document.querySelectorAll('#hoja [data-tab]').forEach(b => b.setAttribute('aria-selected', b === el));
    document.querySelectorAll('#hoja [data-panel]').forEach(p => p.classList.toggle('oculto', p.dataset.panel !== el.dataset.tab));
    return;
  }
  if (el.classList.contains('carta')) return el.classList.toggle('vuelta');
  if (el.hasAttribute('data-revelar')) {
    const p = el.closest('.pregunta'); p.querySelector('.r').classList.remove('oculto');
    el.parentElement.innerHTML = `<button class="boton" data-sabia><i class="ti ti-check"></i>La sabía</button>
      <button class="boton claro" data-otra><i class="ti ti-rotate"></i>Repasar otra vez</button>`;
    return;
  }
  if (el.hasAttribute('data-sabia') || el.hasAttribute('data-otra')) {
    const p = el.closest('.pregunta'); const ok = el.hasAttribute('data-sabia');
    p.classList.toggle('ok', ok); p.classList.toggle('otra', !ok);
    el.parentElement.innerHTML = `<span class="estado ${ok ? 'entregado' : 'sube'}"><i class="ti ${ok ? 'ti-check' : 'ti-rotate'}"></i>${ok ? 'La sabías' : 'Vuelve a mirarla luego'}</span>`;
    const quiz = $('#quiz'); const num = $('#hoja').dataset.act;
    if (quiz && num && !quiz.querySelector('[data-revelar],[data-sabia]')) {
      const todas = [...quiz.querySelectorAll('.pregunta')];
      if (todas.every(x => x.classList.contains('ok')) && leer('rep:' + num) !== '1') {
        guardar('rep:' + num, '1'); $('#logro').innerHTML = logroHTML();
        const r = el.getBoundingClientRect(); confeti(r.left + r.width / 2, r.top);
      } else if (!todas.every(x => x.classList.contains('ok'))) {
        $('#logro').innerHTML = `<div class="logro" style="background:#FFF0D9"><i class="ti ti-rotate" style="color:#8A5410"></i><div><b>Casi</b><br><span class="sub">Vuelve a mirar los conceptos y ábrelo otro día para ganar la estrella.</span></div></div>`;
      }
    }
  }
});
</script>
